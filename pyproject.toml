[project]
name = "quantkit"
version = "0.1.0"
description = "Options pricing, portfolio optimization and backtesting in Python, with every model checked against closed-form results, textbook values or an independent method."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Dai" }]
requires-python = ">=3.11"
keywords = [
    "quantitative-finance",
    "options-pricing",
    "black-scholes",
    "portfolio-optimization",
    "risk-parity",
    "backtesting",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# Lower bounds are the oldest versions that the lockfile exercises in CI
# (the Python 3.11 job resolves numpy 2.4 and scipy 1.17).
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.11.2"]

[project.urls]
Homepage = "https://github.com/ult666666/quantkit"
Repository = "https://github.com/ult666666/quantkit"
Issues = "https://github.com/ult666666/quantkit/issues"
Changelog = "https://github.com/ult666666/quantkit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ult666666/quantkit/blob/main/docs/DESIGN.md"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "scikit-learn>=1.9.1",
]

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "N",   # pep8-naming
    "NPY", # NumPy-specific rules
    "PD",  # pandas-vet
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D103"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
# SciPy and scikit-learn ship without type information (no py.typed marker or
# stubs), so their call results are typed as Any and wrapped in float()/np.asarray().
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "README.md"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--doctest-glob=README.md",
    "--import-mode=importlib",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["quantkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
